services:

  postgres:
    image: postgres:18
    container_name: carbase-postgres

    environment:
      POSTGRES_DB: carbase
      POSTGRES_USER: carbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U carbase -d carbase"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  carbase:
    build:
      context: .
      secrets:
        - sixlabors_license

    container_name: carbase-app

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: >
        Host=postgres;
        Port=5432;
        Database=carbase;
        Username=carbase;
        Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - car-images:/app/wwwroot/uploads/cars
      - data-protection:/root/.aspnet/DataProtection-Keys

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data:
  car-images:
  data-protection:


secrets:
  sixlabors_license:
    file: ./sixlabors.lic